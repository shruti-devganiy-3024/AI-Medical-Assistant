{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedAssist AI — Login</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>MedAssist AI</h1>
      <p class="subtitle">Your AI-powered health companion</p>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>

      <!-- Alert area -->
      <div id="authAlert" class="alert"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-block" id="loginBtn" onclick="handleLogin()">
          <span>Login</span>
        </button>
      </form>

      <!-- REGISTER FORM (hidden by default) -->
      <form id="registerForm" class="auth-form" style="display:none;">

        <div id="loginError" class="error-box" style="display:none;"></div>

        <div class="form-group">
          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="At least 6 characters"
                 minlength="6" required>
        </div>

        <div class="form-group">
          <label for="regConfirm">Confirm Password</label>
          <input type="password" id="regConfirm" placeholder="Repeat password"
                 minlength="6" required>
        </div>

        <button type="submit" class="btn btn-block" id="registerBtn">
          <span>Create Account</span>
        </button>
      </form>
    </div>
  </div>

  <script src="{% static 'js/script.js' %}"></script>
  <script>
    // ============================================================
    // If already logged in → go to dashboard
    // ============================================================
    if (getToken()) {
      window.location.href = '/dashboard/';
    }

    // ============================================================
    // TAB SWITCHING
    // ============================================================
    const tabs = document.querySelectorAll('.auth-tab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const alertEl = document.getElementById('authAlert');

    function showAlert(message, type = 'error') {
      alertEl.textContent = message;
      alertEl.className = `alert alert-${type} show`;
    }

    function clearAlert() {
      alertEl.className = 'alert';
      alertEl.textContent = '';
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        clearAlert();

        if (tab.dataset.tab === 'login') {
          loginForm.style.display = 'block';
          registerForm.style.display = 'none';
        } else {
          loginForm.style.display = 'none';
          registerForm.style.display = 'block';
        }
      });
    });

    // ============================================================
    // LOGIN
    // ============================================================
    loginForm.addEventListener('submit', async (e) => {

    const errorBox = document.getElementById("loginError");
    errorBox.style.display = "none";
    errorBox.textContent = "";
      e.preventDefault();
      clearAlert();

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Logging in...';

      try {
        const data = await apiRequest('/auth/login/', {
          method: 'POST',
          body: JSON.stringify({ username, password }),
        });

        saveAuth(data.token, data.username);
        showToast(`Welcome back, ${data.username}!`, 'success');
        setTimeout(() => (window.location.href = '/dashboard/'), 600);
      } catch (err) {
        const msg = err.message.includes('Invalid')
          ? 'Invalid login credentials'
          : err.message;
        const errorBox = document.getElementById("loginError");
        errorBox.style.display = "block";
        errorBox.textContent = "Invalid username or password";
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Login</span>';
      }
    });

    // ============================================================
    // REGISTER
    // ============================================================
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const username = document.getElementById('regUsername').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm  = document.getElementById('regConfirm').value;

      // Client-side validation
      if (password !== confirm) {
        showAlert('Passwords do not match');
        return;
      }
      if (password.length < 6) {
        showAlert('Password must be at least 6 characters');
        return;
      }

      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Creating account...';

      try {
        const data = await apiRequest('/auth/register/', {
          method: 'POST',
          body: JSON.stringify({ username, email, password }),
        });

        saveAuth(data.token, data.username);
        showToast('Account created successfully!', 'success');
        setTimeout(() => (window.location.href = '/dashboard/'), 600);
      } catch (err) {
        // Backend returns errors like {"username":["already exists"]}
        let msg = err.message;
        try {
          const parsed = JSON.parse(msg);
          if (typeof parsed === 'object') {
            const firstKey = Object.keys(parsed)[0];
            const firstErr = parsed[firstKey];
            msg = `${firstKey}: ${Array.isArray(firstErr) ? firstErr[0] : firstErr}`;
          }
        } catch (_) { /* keep original */ }
        showAlert(msg);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Create Account</span>';
      }
    });
  </script>
</body>
</html>
