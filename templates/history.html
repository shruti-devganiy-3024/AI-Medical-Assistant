{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History — MedAssist AI</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>

  <!-- NAVBAR (identical to chat.html) -->
  <nav class="navbar">
    <div class="brand">🏥 MedAssist AI</div>
    <button class="mobile-toggle" id="mobileToggle">☰</button>
    <div class="nav-links">
      <a href="/dashboard/"   data-page="dashboard">Dashboard</a>
      <a href="/chat/"        data-page="chat">Chat</a>
      <a href="/history/"     data-page="history">History</a>
      <a href="/appointment/" data-page="appointment">Appointment</a>
      <a href="#" id="logoutBtn">Logout</a>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
    </div>
  </nav>

  <main class="container">
    <div class="hist-center-wrap">

      <!--
        This is THE EXACT same sidebar panel from chat.html
        — same classes: chat-sidebar
        — same header structure: h3 + "+ New" button
        — same history-item cards
        — just centered on page instead of left column
      -->
      <div class="chat-sidebar hist-panel">

        <!-- Header — identical to chat.html sidebar header -->
        <h3>
          <span>💬 Chat History</span>
          <a href="/chat/" class="btn btn-secondary"
             style="padding:4px 10px; font-size:12px; text-decoration:none;">
            + New
          </a>
        </h3>

        <!-- Search — sits between header and list -->
        <div class="hist-search-bar">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            id="histSearch"
            type="text"
            placeholder="Search conversations..."
            autocomplete="off"
          />
          <button id="histClear" title="Clear">
            <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6"  x2="6"  y2="18"></line>
              <line x1="6"  y1="6"  x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Count label -->
        <p class="hist-count-label" id="histCount"></p>

        <!-- List — filled by JS using same .history-item class -->
        <div id="histList">
          <p style="color:var(--text-muted); font-size:13px;
                    text-align:center; padding:20px 0;">
            Loading...
          </p>
        </div>

      </div>
      <!-- /chat-sidebar -->

    </div>
  </main>

  <script src="{% static 'js/script.js' %}"></script>
  <script>
  if (!requireAuth()) {}
  setupNavbar('history');

  /* ── state ─────────────────────────── */
  let allChats = [];
  let filtered = [];

  /* ── DOM ───────────────────────────── */
  const histList   = document.getElementById('histList');
  const histCount  = document.getElementById('histCount');
  const histSearch = document.getElementById('histSearch');
  const histClear  = document.getElementById('histClear');

  /* ── trash SVG ─────────────────────── */
  const trashIcon = `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="13" height="13" viewBox="0 0 24 24"
         fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round"
         stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8
               a2 2 0 0 1-2-2L5 6"></path>
      <path d="M10 11v6M14 11v6"></path>
      <path d="M9 6V4a1 1 0 0 1 1-1h4
               a1 1 0 0 1 1 1v2"></path>
    </svg>`;

  /* ── build one card
       Uses EXACT same .history-item structure as chat.html
       with one extra row for Open + Delete actions
  ─────────────────────────────────────────────────── */
  function buildCard(chat) {
    const title   = escapeHtml(chat.title || 'New Chat');
    const preview = escapeHtml(
      chat.last_message_preview || 'No messages yet.'
    );
    const date  = formatDate(chat.updated_at);
    const count = chat.message_count || 0;

    return `
      <div class="history-item" data-id="${chat.id}">

        <!-- Line 1: title (bold) — same as chat sidebar -->
        <strong class="hist-item-title">${title}</strong>

        <!-- Line 2: timestamp (light, small) -->
        <div class="preview">🕐 ${date}</div>

        <!-- Line 3: preview (1 line, truncated) -->
        <div class="preview hist-item-preview">
          ${count} msg${count !== 1 ? 's' : ''}
          &nbsp;·&nbsp;
          ${preview}
        </div>

        <!-- Actions: Open + Delete -->
        <div class="hist-item-actions">
          <button class="btn hist-open-btn"
                  data-id="${chat.id}"
                  style="padding:4px 12px; font-size:12px;">
            Open
          </button>
          <button class="hist-del-btn"
                  data-id="${chat.id}"
                  title="Delete conversation">
            ${trashIcon}
          </button>
        </div>

      </div>`;
  }

  /* ── render ─────────────────────────── */
  function render(list, isSearch = false) {
    /* count label */
    histCount.textContent = list.length
      ? `${list.length} conversation${list.length !== 1 ? 's' : ''}`
      : '';

    if (!list.length) {
      histList.innerHTML = isSearch
        ? `<p style="color:var(--text-muted); font-size:13px;
                     text-align:center; padding:20px 0;">
             No results.
             <button onclick="clearSearch()"
                     style="background:none; border:none;
                            color:var(--primary); cursor:pointer;
                            font-size:13px; text-decoration:underline;">
               Clear
             </button>
           </p>`
        : `<p style="color:var(--text-muted); font-size:13px;
                     text-align:center; padding:20px 0;">
             No conversations yet.<br>
             <a href="/chat/"
                style="color:var(--primary); font-size:13px;">
               Start your first chat →
             </a>
           </p>`;
      return;
    }

    histList.innerHTML = list.map(buildCard).join('');

    /* open */
    histList.querySelectorAll('.hist-open-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        window.location.href = `/chat/?chatId=${btn.dataset.id}`;
      });
    });

    /* delete */
    histList.querySelectorAll('.hist-del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id   = parseInt(btn.dataset.id);
        const card = btn.closest('.history-item');
        const t    = card.querySelector('.hist-item-title').textContent;

        if (!confirm(`Delete "${t}"?\nThis cannot be undone.`)) return;

        try {
          await apiRequest(`/chats/${id}/`, { method: 'DELETE' });

          /* animate out */
          card.style.transition = 'opacity .22s, transform .22s';
          card.style.opacity    = '0';
          card.style.transform  = 'translateX(10px)';

          setTimeout(() => {
            allChats = allChats.filter(c => c.id !== id);
            filtered = filtered.filter(c => c.id !== id);
            const s  = histSearch.value.trim().length > 0;
            render(s ? filtered : allChats, s);
            showToast('Deleted.', 'success');
          }, 230);

        } catch (e) {
          showToast(`Error: ${e.message}`, 'error');
        }
      });
    });
  }

  /* ── search ─────────────────────────── */
  function applySearch(q) {
    const query = q.trim().toLowerCase();
    histClear.style.display = query ? 'flex' : 'none';

    if (!query) {
      filtered = [...allChats];
      render(allChats, false);
      return;
    }
    filtered = allChats.filter(c =>
      (c.title                || '').toLowerCase().includes(query) ||
      (c.last_message_preview || '').toLowerCase().includes(query)
    );
    render(filtered, true);
  }

  function clearSearch() {
    histSearch.value        = '';
    histClear.style.display = 'none';
    filtered                = [...allChats];
    render(allChats, false);
    histSearch.focus();
  }

  /* ── load ───────────────────────────── */
  async function load() {
    try {
      const data = await apiRequest('/chats/');
      allChats   = data || [];
      filtered   = [...allChats];
      render(allChats, false);
    } catch (e) {
      histList.innerHTML = `
        <p style="color:var(--error); font-size:13px;
                  text-align:center; padding:20px 0;">
          ${escapeHtml(e.message)}
          <button class="btn" style="margin-top:8px; display:block;
                  margin-left:auto; margin-right:auto;"
                  onclick="load()">Retry</button>
        </p>`;
    }
  }

  /* ── events ─────────────────────────── */
  histSearch.addEventListener('input',
    e => applySearch(e.target.value));
  histSearch.addEventListener('keydown',
    e => { if (e.key === 'Escape') clearSearch(); });
  histClear.addEventListener('click', clearSearch);

  load();
  </script>

</body>
</html>
